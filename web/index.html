<!doctype html>
<html lang="tr" translate="no" data-theme="mavi">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="pafta-token" content="{{TOKEN}}">
<title>Pafta</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="Pafta ana harita">
    <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true">
      <path d="M5 35 L5 5 L35 35 Z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M11 29 L11 19 L21 29 Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M5 11h3M5 17h3M5 23h3M5 29h3" stroke="currentColor" stroke-width="1.4"/>
      <circle cx="30" cy="9" r="4.2" fill="var(--marker)"/>
    </svg>
    <span class="brand-name">PAFTA</span>
    <span class="brand-sub">dil yolları · purple team</span>
  </a>
  <nav class="nav" aria-label="Ana menü">
    <a href="#/" data-nav="harita">Harita</a>
    <a href="#/rota" data-nav="rota">Rota</a>
    <a href="#/tekrar" data-nav="tekrar">Tekrar <b class="badge" id="dueBadge" hidden>0</b></a>
    <a href="#/tezgah" data-nav="tezgah">Serbest Tezgah</a>
    <a href="#/sinav" data-nav="sinav">Sınav</a>
  </nav>
  <div class="top-right">
    <span class="chip" id="streakChip" title="Art arda çalıştığın gün">SERİ <b>0</b> GÜN</span>
    <button class="ghost-btn" id="themeBtn" type="button" title="Tema değiştir">MAVİ KOPYA</button>
    <button class="ghost-btn icon" id="settingsBtn" type="button" title="Ayarlar" aria-label="Ayarlar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M5.2 18.8l2.1-2.1M16.7 7.3l2.1-2.1" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>
<main id="view" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<script type="module" src="/app.js"></script>
</body>
</html>
